<text class="line" style="animation-delay:0.40s" x="24" y="78" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#38bdae">$ python</text><text class="line" style="animation-delay:0.85s" x="24" y="104" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>from rag import *</text><text class="line" style="animation-delay:1.30s" x="24" y="130" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>from rag.llm import GroqChat</text><text class="line" style="animation-delay:1.75s" x="24" y="156" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>store = VectorStore()</text><text class="line" style="animation-delay:2.20s" x="24" y="182" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>docs = load_folder(&quot;data/sample&quot;)</text><text class="line" style="animation-delay:2.65s" x="24" y="208" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>store.add(chunk_pages(docs, 500, 100))</text><text class="line" style="animation-delay:3.10s" x="24" y="234" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#8b93b8">15</text><text class="line" style="animation-delay:3.55s" x="24" y="260" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>q = (&quot;How many days of annual &quot;</text><text class="line" style="animation-delay:4.00s" x="24" y="286" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">... </tspan>     &quot;leave do I get?&quot;)</text><text class="line" style="animation-delay:4.45s" x="24" y="312" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>for h in store.search(q, k=2):</text><text class="line" style="animation-delay:4.90s" x="24" y="338" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">... </tspan>    print(f&quot;{h.score:.2f}&quot;, h.source)</text><text class="line" style="animation-delay:5.35s" x="24" y="364" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#8b93b8">0.79 northwind_handbook.md</text><text class="line" style="animation-delay:5.80s" x="24" y="390" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#8b93b8">0.56 northwind_handbook.md</text><text class="line" style="animation-delay:6.25s" x="24" y="416" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>llm = GroqChat(api_key, model)</text><text class="line" style="animation-delay:6.70s" x="24" y="442" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>rag = RAGPipeline(store, llm)</text><text class="line" style="animation-delay:7.15s" x="24" y="468" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#c0caf5"><tspan fill="#bb9af7">&gt;&gt;&gt; </tspan>print(rag.answer(q).text)</text><text class="line" style="animation-delay:7.60s" x="24" y="494" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#9ece6a">Full-time employees receive 20</text><text class="line" style="animation-delay:8.05s" x="24" y="520" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#9ece6a">days of paid annual leave per</text><text class="line" style="animation-delay:8.50s" x="24" y="546" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" xml:space="preserve" fill="#9ece6a">calendar year [1].</text><text class="line" style="animation-delay:8.95s" x="24" y="572" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15.5" fill="#bb9af7">&gt;&gt;&gt; <tspan class="cursor" fill="#c0caf5">▌</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="460" height="450" viewBox="0 0 460 450" role="img" aria-labelledby="title" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<title id="title">RAG pipeline: upload, chunk, embed, search, filter, generate, answer with citations</title>
